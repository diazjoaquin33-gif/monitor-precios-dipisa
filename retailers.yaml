santaisabel:
  nombre: "Santa Isabel"
  metodo: "api_post_json"
  api_url: "https://bff.santaisabel.cl/catalog/pdp"
  api_headers:
    apikey: "be-reg-groceries-sisa-catalog-wdhhq5a2fken"
  api_body:
    store: "pedrofontova"
  campo_precio: "items.0.price"
  campo_precio_normal: "items.0.listPrice"
  campo_disponible: "items.0.stock"
  selector_precio: '(?:property|name)="product:price:amount"\s+content="([\d.,]+)"'
  selector_disponibilidad: '(?:property|name)="product:availability"\s+content="([^"]+)"'

jumbo:
  nombre: "Jumbo"
  metodo: "meta_tag"
  selector_precio: '(?:property|name)="product:price:amount"\s+content="([\d.,]+)"'
  selector_disponibilidad: '(?:property|name)="product:availability"\s+content="([^"]+)"'
  buscar_precio_lista_embebido: true

alvi:
  nombre: "Alvi"
  patron_precio_oferta: 'Desde 1 un[^\$]*\$([\d.,]+)'

tottus:
  nombre: "Tottus"
  metodo: "curl_cffi"

lider:
  nombre: "Líder"
  metodo: "lider_api"

unimarc:
  nombre: "Unimarc"
  metodo: "curl_cffi"
  patron_precio_oferta: '\$\s*([\d.,]+)'

acuenta:
  nombre: "aCuenta"
  metodo: "instaleap"
  # Verificado 24/08/2026: acuenta.cl es una SPA (el precio no está en el
  # HTML crudo) y además su certificado SSL está mal configurado (falta la
  # cadena intermedia) — falla tanto con requests como con curl_cffi. Pero
  # su propio frontend pide los datos a la API pública de Instaleap
  # (nextgentheadless.instaleap.io), que no tiene ninguno de esos dos
  # problemas. client_id/store_reference identifican la tienda específica
  # (580 = aCuenta El Monte) — el precio podría variar levemente por local.
  client_id: "SUPER_BODEGA"
  store_reference: "580"

knasta:
  nombre: "Knasta (Líder)"
  # Comparador de precios independiente, no es el sitio de Líder — su
  # robots.txt permite explícitamente /detail/... (solo prohíbe /api y
  # /redirect, que no usamos). Trae el precio en meta tag estándar
  # product:price:amount, sin protección anti-bot. Verificado 24/08/2026:
  # no expone precio de lista para el producto principal en la página
  # de detalle (el "originalPrice" que aparece ahí es de productos
  # relacionados en el carrusel, no del producto en cuestión) — solo se
  # trackea el precio actual, sin oferta/lista por ahora.
  patron_precio_oferta: '(?:property|name)="product:price:amount"\s+content="([\d.,]+)"'
