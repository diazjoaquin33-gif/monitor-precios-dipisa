# Configuración de tiendas/retailers a monitorear.
#
# Cada tienda define un "metodo":
#   - meta_tag: lectura de un meta tag <meta property="..."> o <meta name="...">
#     con el precio, en el HTML crudo. Funciona en tiendas VTEX (Santa Isabel,
#     Jumbo — grupo Cencosud). El atributo (property vs name) puede variar
#     entre sitios; el regex de abajo acepta ambos.
#   - text_pattern: busca dos precios (oferta y normal) directo en el texto del
#     HTML crudo, sin meta tags. Funciona en sitios con SSR real (ej. Next.js)
#     que ya traen ambos precios renderizados desde el servidor.
#   - playwright: renderiza con navegador headless y lee el precio con un
#     selector CSS (más lento, requiere packages.txt adicional en el
#     despliegue). Frágil si el sitio usa clases CSS autogeneradas que
#     cambian en cada deploy (ej. Next.js/CSS modules) — en ese caso usar
#     playwright_text en vez de este.
#   - playwright_text: igual que playwright (navegador headless, pasa
#     protecciones anti-bot básicas tipo Akamai/Cloudflare), pero busca el
#     precio con un patrón de texto sobre el texto visible ya renderizado,
#     no con un selector CSS. Usa las mismas claves patron_precio_oferta /
#     patron_precio_normal que text_pattern.
#
# IMPORTANTE: nunca apuntar a endpoints tipo /api/... de un retailer sin revisar
# antes su robots.txt — varios los bloquean explícitamente para bots, aunque
# respondan igual si se les consulta. meta_tag y text_pattern leen lo mismo que
# ve cualquier visitante normal al abrir la página.

santaisabel:
  nombre: "Santa Isabel"
  metodo: meta_tag
  # Verificado 18/08/2026 contra el sitio real: usa property="product:price:amount".
  selector_precio: '(?:property|name)="product:price:amount"\s+content="([\d.,]+)"'
  selector_disponibilidad: '(?:property|name)="product:availability"\s+content="([^"]+)"'

jumbo:
  nombre: "Jumbo"
  metodo: meta_tag
  # Verificado 18/08/2026: Jumbo usa name="product:price:amount" (no property=,
  # a diferencia de Santa Isabel). El regex ahora acepta ambos atributos.
  selector_precio: '(?:property|name)="product:price:amount"\s+content="([\d.,]+)"'
  selector_disponibilidad: '(?:property|name)="product:availability"\s+content="([^"]+)"'

# lider: DESHABILITADO — verificado 18/08/2026: el sitio devuelve una página de
# verificación anti-bot ("Robot or human?") en vez del HTML del producto, incluso
# con headers de navegador normal. Los patrones text_pattern que había antes no
# podían funcionar porque nunca llegan a ver el HTML real. Requeriría técnicas de
# evasión de bot-detection para forzarlo, lo cual no vamos a hacer. Si más adelante
# se necesita este retailer, evaluar una fuente de datos alternativa (ej. API
# pública si existe, o partner de datos) en vez de scraping directo.
# lider:
#   nombre: "Líder"
#   metodo: text_pattern
#   patron_precio_oferta: 'El precio actual es \$([\d.,]+)'
#   patron_precio_normal: 'costaba\$?([\d.,]+)'

# unimarc: PENDIENTE — el sitio bloquea requests directos (bot detection activa,
# no es solo falta de headers). Necesita revisión aparte: probablemente Playwright
# + headers más elaborados, o puede seguir bloqueando igual. No agregar todavía.

alvi:
  nombre: "Alvi"
  metodo: playwright_text
  # Verificado 18/08/2026: alvi.cl bloquea requests HTTP simples con un muro
  # anti-bot de Akamai, pero un navegador headless (Playwright) sí pasa.
  # Además tiene "Precio regular" y "Precio socio" (con Club Alvi) por
  # separado — se monitorea el precio regular para comparar 1 a 1 con
  # retailers sin membresía.
  patron_precio_oferta: 'Precio regular\s*\$([\d.,]+)'

tottus:
  nombre: "Tottus"
  metodo: playwright_text
  # Verificado 19-20/08/2026: tottus.cl usa un desafío JS de Cloudflare
  # ("Just a moment...") ante requests simples; un navegador headless
  # (Playwright) sí lo pasa. El precio se muestra como "$ 7.790" (con
  # espacio) seguido de "UN" — el patrón no exige el "-XX%" de descuento
  # porque varios productos no tienen oferta activa y ahí no aparece. El
  # precio normal aparece justo después del paréntesis de precio por unidad
  # de medida (puede decir "por MT" o "por 100UN" según el producto, por eso
  # el patrón no depende del texto de la unidad, solo del ")" que cierra) —
  # si un producto no tiene oferta tampoco hay precio normal aparte, y la
  # app usa el precio único como ambos valores automáticamente.
  patron_precio_oferta: '\$\s*([\d.,]+)\s*\nUN'
  patron_precio_normal: '\)\s*\n\$\s*([\d.,]+)'

# Para agregar una tienda nueva:
# 1. Abre una página de producto de esa tienda y mira si el precio aparece en el
#    HTML crudo sin JS (clic derecho > "Ver código fuente", Ctrl+F "price" o el
#    precio en pesos, ej. "$1.990").
# 2. Si aparece en un <meta property="product:price:amount"> o
#    <meta name="product:price:amount"> -> metodo: meta_tag.
#    Si aparece como texto plano tipo "El precio actual es $X" -> metodo: text_pattern.
#    Si NO aparece nada (solo "Cargando..." o vacío, o una página de verificación
#    tipo "Robot or human?") -> el sitio probablemente bloquea requests simples;
#    metodo: playwright puede ayudar pero no siempre alcanza contra bot-detection
#    activa (Akamai, PerimeterX, etc.).
# 3. Agrega el bloque siguiendo el formato de arriba.
