name: Actualizador de Precios Dipisa

on:
  schedule:
    # Objetivo: ~07:00, 16:00 y 23:00 (Hora de Chile). Dos horarios por
    # franja (a los :07 y a los :37, no en punto) en vez de uno solo: el
    # schedule de GitHub Actions es conocido por perder o retrasar corridas
    # en repos de poco tráfico, sobre todo justo en la hora exacta (todo el
    # mundo agenda cron ahí, así que GitHub prioriza/descarta bajo esa
    # congestión). Confirmado el 27-28/08/2026: incluso después de "tocar"
    # este archivo para reactivar el registro del cron, se disparó una vez
    # y volvió a saltarse el siguiente horario — asumimos que va a seguir
    # fallando ocasionalmente y la redundancia es la mitigación, no una
    # curita puntual. Si de todas formas se saltan ambos intentos de una
    # franja, el fallback a "último precio conocido" ya cubre eso en la
    # página sin que se rompa nada.
    #
    # Minutos "raros" (:14 y :47) a propósito: las corridas manuales scrapean
    # Knasta bien pero las programadas caían con 403, y la diferencia es la IP
    # del runner — los minutos redondos (0/15/30/45) y los "clásicos para
    # evitar la hora" (7/37) comparten los pools de IP más castigados por
    # otros scrapers. Con un minuto poco común el runner suele caer en una IP
    # menos quemada.
    - cron: '14,47 11,20,3 * * *'
  workflow_dispatch: # Te agrega un botón en GitHub para correrlo manualmente cuando quieras

jobs:
  scraping:
    runs-on: ubuntu-latest
    # Una corrida normal tarda ~6 min. Si algún retailer se pone a bloquear en
    # masa, el scraper reintenta y la corrida se estira — nunca es un cuelgue
    # infinito (cada request tiene timeout y los reintentos están topeados),
    # pero para no dejar un job dando vueltas ni quemar minutos de Actions se
    # corta a los 20. Si se corta, esa franja usa el "último precio conocido".
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          # pandas<3: la serie 3.x cambió el dtype por defecto de las columnas
          # de texto (a un dtype 'str' estricto que no acepta asignar un
          # número dentro de una celda), y eso rompió sincronizar_desde_catalogo
          # en producción el 24/09/2026 apenas GitHub Actions instaló la 3.x
          # sin que nadie tocara nada acá. Fijar la versión evita que una
          # actualización silenciosa de una librería vuelva a tumbar el scraper.
          pip install "pandas<3" pyyaml requests curl_cffi

      - name: Ejecutar Extractor de Precios
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python scraper.py

      - name: Guardar y subir nuevos precios
        run: |
          git config --global user.name "Dipisa-Bot"
          git config --global user.email "bot@dipisa.cl"
          # Por si alguien pusheó algo (ej. nuevos SKU) mientras corría el
          # scraper — sin esto, el "git push" de más abajo fallaría con un
          # rechazo "non-fast-forward" y la corrida quedaría marcada en rojo
          # aunque el scraping en sí haya salido perfecto.
          git pull --rebase --autostash origin main
          # -- ignore-errors: catalogo_cache.csv no existe hasta que se active
          # esa función, y "git add" de un archivo inexistente aborta.
          # productos.csv se incluye porque el scraper lo reescribe solo cuando
          # la planilla de Catálogo trae cambios válidos (sincronizar_desde_catalogo).
          # respaldos/ son copias fechadas de productos.csv, una por semana
          # (guardar_respaldo_semanal en scraper.py).
          git add --ignore-errors \
            datos_procesados.json historial_precios.csv estado_scraper.json \
            url_overrides_cache.json catalogo_cache.csv productos.csv respaldos/ || true
          # historial_catalogo.json (altas/bajas/ediciones de catálogo que
          # muestra la app, ver _registrar_cambios_catalogo en scraper.py) no
          # existe hasta la primera corrida que detecte un cambio real — un
          # "git add" de un archivo que todavía no existe en ningún lado es
          # SIEMPRE fatal (aborta TODO el comando, no solo ese archivo) aunque
          # se use --ignore-errors, así que se agrega aparte y solo si existe.
          if [ -f historial_catalogo.json ]; then
            git add historial_catalogo.json
          fi
          # Si hay cambios en los precios, los sube a GitHub automáticamente
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Actualización automática de precios" && git push)
